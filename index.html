 transform='rotate(318.0)'/%3E%3C/g%3E%3Ccircle r='6' fill='%23FF4DA6' fill-opacity='0.26'/%3E%3C/g%3E%3Cg transform='translate(300 250) scale(0.6)'%3E%3Cg fill='%23FF4DA6' fill-opacity='0.16'%3E%3Cellipse cx='0' cy='-16' rx='9' ry='16' transform='rotate(0.0)'/%3E%3Cellipse cx='0' cy='-16' rx='9' ry='16' transform='rotate(72.0)'/%3E%3Cellipse cx='0' cy='-16' rx='9' ry='16' transform='rotate(144.0)'/%3E%3Cellipse cx='0' cy='-16' rx='9' ry='16' transform='rotate(216.0)'/%3E%3Cellipse cx='0' cy='-16' rx='9' ry='16' transform='rotate(288.0)'/%3E%3C/g%3E%3Ccircle r='6' fill='%23FF4DA6' fill-opacity='0.26'/%3E%3C/g%3E%3Cg transform='translate(60 175) scale(0.8)'%3E%3Cg fill='%23FF4DA6' fill-opacity='0.16'%3E%3Cellipse cx='0' cy='-16' rx='9' ry='16' transform='rotate(20.0)'/%3E%3Cellipse cx='0' cy='-16' rx='9' ry='16' transform='rotate(92.0)'/%3E%3Cellipse cx='0' cy='-16' rx='9' ry='16' transform='rotate(164.0)'/%3E%3Cellipse cx='0' cy='-16' rx='9' ry='16' transform='rotate(236.0)'/%3E%3Cellipse cx='0' cy='-16' rx='9' ry='16' transform='rotate(308.0)'/%3E%3C/g%3E%3Ccircle r='6' fill='%23FF4DA6' fill-opacity='0.26'/%3E%3C/g%3E%3Cellipse cx='150' cy='190' rx='4' ry='10' transform='rotate(40 150 190)' fill='%23FF4DA6' fill-opacity='0.16'/%3E%3Cellipse cx='120' cy='130' rx='4' ry='10' transform='rotate(-35 120 130)' fill='%23FF4DA6' fill-opacity='0.16'/%3E%3Cellipse cx='290' cy='200' rx='4' ry='10' transform='rotate(25 290 200)' fill='%23FF4DA6' fill-opacity='0.16'/%3E%3Ccircle cx='30' cy='40' r='3' fill='%23FF4DA6' fill-opacity='0.26'/%3E%3Ccircle cx='165' cy='30' r='3' fill='%23FF4DA6' fill-opacity='0.26'/%3E%3Ccircle cx='110' cy='255' r='3' fill='%23FF4DA6' fill-opacity='0.26'/%3E%3Ccircle cx='320' cy='175' r='3' fill='%23FF4DA6' fill-opacity='0.26'/%3E%3C/g%3E%3C/svg%3E");

body {
  background-color: var(--bg);
  background-image: var(--bloom), var(--bloom2), var(--flowers);
  background-repeat: no-repeat, no-repeat, repeat;
  background-position: right -70px top -50px, left -70px bottom -50px, 0 0;
  background-size: 340px 340px, 340px 340px, 240px 240px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.45;
  padding-block: 40px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* Header */
.head { display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px; }
.eyebrow { color: var(--muted); font-size: .85rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
h1 { color: var(--accent); font-family: var(--display); font-weight: 700; font-size: 2.6rem; line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance; }
.sub { color: var(--muted); }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; }
.who { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .95rem; }
.who .link { padding: 0; }
.app-body { display: flex; flex-direction: column; gap: 20px; }
.err { color: var(--late); font-weight: 600; font-size: .95rem; }
.fields.three { grid-template-columns: repeat(3, 1fr); }
.form-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.btn:disabled { opacity: .6; cursor: progress; }
.title-row { display: flex; align-items: center; gap: 14px; }
.title-row h1 { min-width: 0; }
.unicorn { flex: none; display: block; width: 78px; height: 75px; overflow: visible; }
.u-mane, .u-horn, .u-spark { fill: var(--accent); }
.u-mane2 { fill-opacity: .6; }
.u-head { fill: #fff; stroke: #2B1220; stroke-width: 2.5; stroke-linejoin: round; }
.u-horn { stroke: #2B1220; stroke-width: 2.5; stroke-linejoin: round; }
.u-stripe { fill: none; stroke: #fff; stroke-opacity: .6; stroke-width: 2; }
.u-blush { fill: var(--accent); fill-opacity: .3; }
.u-eye, .u-nostril { fill: #2B1220; }
.u-glint { fill: #fff; }

/* Summary */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stat { display: flex; flex-direction: column; gap: 4px; padding: 20px 24px; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; background: var(--accent); }
.stat:first-child .num, .stat:first-child .lbl { color: var(--accent-ink); }
.num { font-family: var(--display); font-weight: 700; font-size: 3rem; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.lbl { color: var(--muted); font-size: .95rem; font-weight: 500; }
.stat.late.on { background: var(--late-soft); }
.stat.late.on .num, .stat.late.on .lbl { color: var(--late); }

/* Example note */
.note { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 14px 18px; border-radius: 14px; background: var(--accent-soft); font-size: .95rem; }
.link { font: inherit; font-weight: 600; color: var(--ink); background: none; border: 0; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* Cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.add { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.h2 { font-family: var(--display); font-weight: 700; font-size: 1.25rem; letter-spacing: -0.01em; }
.fields { display: grid; grid-template-columns: 1fr 1fr auto; gap: 14px; align-items: end; }
.f { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.f.what { grid-column: 1 / -1; }
.f span { color: var(--muted); font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.f input { font: inherit; color: var(--ink); background: var(--soft); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 16px; min-height: 54px; width: 100%; min-width: 0; }
.f input::placeholder { color: var(--muted); opacity: .75; }
.f input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.btn { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 0 28px; min-height: 54px; cursor: pointer; transition: filter .15s; }
.btn:hover { filter: brightness(1.08); }

/* Owner list header */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.fbtn { font: inherit; font-size: .95rem; font-weight: 500; padding: 8px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.fbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.groups { display: flex; flex-direction: column; gap: 16px; }
.group { overflow: hidden; }
.g-head { display: flex; align-items: center; gap: 14px; padding: 18px 20px; }
.avatar { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--accent-soft); border: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 1.2rem; }
.g-name { flex: 1; min-width: 0; }
.g-name h3 { font-family: var(--display); font-weight: 700; font-size: 1.35rem; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.g-name p { color: var(--muted); font-size: .92rem; }
.pill { flex: none; font-size: .85rem; font-weight: 600; padding: 5px 12px; border-radius: 999px; }
.pill.late { background: var(--late-soft); color: var(--late); }
.pill.ok { background: var(--accent-soft); color: var(--ink); }

.items { list-style: none; margin: 0; padding: 0; }
.item { display: flex; align-items: stretch; border-top: 1px solid var(--line); }
.item.late { background: var(--late-soft); }
.row { position: relative; flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 16px; padding: 16px 4px 16px 20px; cursor: pointer; }
.row input { position: absolute; left: 20px; top: 16px; width: 28px; height: 28px; opacity: 0; margin: 0; cursor: pointer; }
.box { flex: none; width: 28px; height: 28px; margin-top: 1px; border-radius: 9px; border: 2px solid var(--box-line); background: var(--card); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.box::after { content: ""; width: 12px; height: 7px; border-left: 3px solid var(--accent-ink); border-bottom: 3px solid var(--accent-ink); transform: translateY(-1px) rotate(-45deg) scale(0); transition: transform .15s; }
.row input:checked + .box { background: var(--accent); border-color: var(--accent); }
.row input:checked + .box::after { transform: translateY(-1px) rotate(-45deg) scale(1); }
.row input:focus-visible + .box { outline: 3px solid var(--accent); outline-offset: 3px; }
.item.late .box { border-color: var(--late); }
.body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.text { font-size: 1.1rem; font-weight: 500; overflow-wrap: anywhere; }
.due { color: var(--muted); font-size: .92rem; font-variant-numeric: tabular-nums; }
.item.late .due { color: var(--late); font-weight: 600; }
.item.done .text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.x { flex: none; width: 52px; display: grid; place-items: center; background: none; border: 0; color: var(--muted); cursor: pointer; opacity: .7; }
.x:hover { opacity: 1; color: var(--late); }
.x svg { width: 20px; height: 20px; }

.empty { padding: 32px 24px; text-align: center; border: 1.5px dashed var(--line); border-radius: var(--radius); color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-family: var(--display); font-size: 1.2rem; margin-bottom: 4px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 16px; background: var(--ink); color: var(--bg); padding: 10px 12px 10px 20px; border-radius: 14px; font-size: .95rem; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.toast button { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 9px; padding: 8px 14px; cursor: pointer; }

@media (max-width: 560px) {
  body { font-size: 17px; padding-block: 28px 64px; }
  body { background-size: 240px 240px, 240px 240px, 200px 200px; background-position: right -50px top -40px, left -50px bottom -40px, 0 0; }
  h1 { font-size: 2.1rem; }
  .unicorn { width: 60px; height: 58px; }
  .title-row { gap: 10px; }
  .stat { padding: 16px; }
  .num { font-size: 2.4rem; }
  .add { padding: 18px; }
  .fields, .fields.three { grid-template-columns: 1fr; }
  .btn { width: 100%; }
  .g-head { padding: 16px; }
  .row { padding-left: 16px; }
  .row input { left: 16px; }
  .x { width: 44px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <header class="head">
    <div class="top">
      <p class="eyebrow" id="today"></p>
      <div class="who" id="who" hidden>
        <span id="who-name"></span>
        <button type="button" class="link" id="change-pw" aria-expanded="false" aria-controls="pw-form">Change password</button>
        <button type="button" class="link" id="sign-out">Sign out</button>
      </div>
    </div>
    <div class="title-row">
      <h1>Meeting actions</h1>
      <svg class="unicorn" viewBox="0 0 104 100" width="78" height="75" aria-hidden="true" focusable="false">
      <path class="u-mane" d="M38 36 C22 36 14 48 18 62 C20 70 16 78 22 88 C26 78 28 70 30 62 C32 54 36 48 40 44 Z"/>
      <path class="u-mane u-mane2" d="M36 46 C26 52 22 64 26 76 C28 82 26 90 30 98 C34 90 34 82 34 72 C34 62 36 54 40 50 Z"/>
      <path class="u-head" d="M32 96 C30 78 30 58 36 42 L40 26 L49 38 C54 40 58 38 62 38 C70 42 78 48 86 56 C92 62 94 68 90 73 C86 77 80 77 76 74 C70 72 66 74 62 70 C58 78 58 88 60 96 C52 99 40 99 32 96 Z"/>
      <path class="u-blush" d="M40.5 33 L45 38 L39.5 39 Z"/>
      <path class="u-horn" d="M55 41 L64 41 L70 6 Z"/>
      <path class="u-stripe" d="M57.2 34 L62.4 35 M58.8 27 L63.8 28 M60.4 20 L65.2 21"/>
      <path class="u-mane u-fore" d="M47 38 C43 29 52 25 57 34 C54 37 50 38 47 38 Z"/>
      <circle class="u-blush" cx="70" cy="62" r="5.5"/>
      <circle class="u-eye" cx="62" cy="53" r="3.2"/>
      <circle class="u-glint" cx="63" cy="52" r="1"/>
      <ellipse class="u-nostril" cx="87" cy="64" rx="1.6" ry="2.2"/>
      <path class="u-spark" d="M92 14 Q92 20 98 20 Q92 20 92 26 Q92 20 86 20 Q92 20 92 14 Z"/>
      <path class="u-spark" d="M99 36 Q99 39 102 39 Q99 39 99 42 Q99 39 96 39 Q99 39 99 36 Z"/>
      </svg>
    </div>
    <p class="sub">Every action gets one owner and one due date.</p>
  </header>

  <!-- forms use novalidate: checks run in script so the message shows in every browser (some embedded browsers never show the native pop-ups) -->
  <form class="card add login" id="login-form" novalidate hidden>
    <h2 class="h2">Sign in</h2>
    <div class="fields">
      <label class="f"><span>Username</span><input id="l-user" type="text" required maxlength="80" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="e.g. priya"></label>
      <label class="f"><span>Password</span><input id="l-pass" type="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit" id="l-btn">Sign in</button>
    </div>
    <p class="err" id="login-err" role="alert" hidden></p>
  </form>

  <div class="app-body" id="app-body" hidden>
  <form class="card add" id="pw-form" novalidate hidden>
    <h2 class="h2">Change your password</h2>
    <div class="fields three">
      <label class="f"><span>Current password</span><input id="pw-current" type="password" required autocomplete="current-password"></label>
      <label class="f"><span>New password</span><input id="pw-new" type="password" required minlength="8" autocomplete="new-password"></label>
      <label class="f"><span>Repeat new password</span><input id="pw-repeat" type="password" required minlength="8" autocomplete="new-password"></label>
    </div>
    <p class="err" id="pw-err" role="alert" hidden></p>
    <div class="form-actions">
      <button class="btn" type="submit" id="pw-btn">Save new password</button>
      <button type="button" class="link" id="pw-cancel">Cancel</button>
    </div>
  </form>

  <section class="stats" aria-label="Summary">
    <div class="stat"><span class="num" id="n-open">0</span><span class="lbl">Open</span></div>
    <div class="stat"><span class="num" id="n-done">0</span><span class="lbl">Done</span></div>
    <div class="stat late" id="stat-late"><span class="num" id="n-late">0</span><span class="lbl">Overdue</span></div>
  </section>

  <div class="note" id="note" hidden>
    <span>These are example actions so you can see how the tracker works.</span>
    <button type="button" class="link" id="clear-examples">Clear examples</button>
  </div>

  <form class="card add" id="add-form" autocomplete="off" novalidate>
    <h2 class="h2">Add an action</h2>
    <div class="fields">
      <label class="f what"><span>Action</span><input id="f-text" type="text" required maxlength="140" placeholder="e.g. Send the revised budget to finance"></label>
      <label class="f"><span>Owner</span><input id="f-owner" type="text" list="owners" required maxlength="40" placeholder="Who is doing it?"></label>
      <label class="f"><span>Due</span><input id="f-due" type="date" required></label>
      <button class="btn" type="submit">Add action</button>
    </div>
    <p class="err" id="add-err" role="alert" hidden></p>
    <datalist id="owners"></datalist>
  </form>

  <section aria-labelledby="by-owner">
    <div class="bar">
      <h2 class="h2" id="by-owner">By owner</h2>
      <div class="filters" role="group" aria-label="Filter actions">
        <button type="button" class="fbtn" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="fbtn" data-filter="open" aria-pressed="false">Open</button>
        <button type="button" class="fbtn" data-filter="late" aria-pressed="false">Overdue</button>
        <button type="button" class="fbtn" data-filter="done" aria-pressed="false">Done</button>
      </div>
    </div>
    <div class="groups" id="groups"></div>
  </section>
  </div>
</main>

<div class="toast" id="toast" role="status" hidden>
  <span id="toast-msg"></span>
  <button type="button" id="undo">Undo</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.min.js"></script>
<script>
(function () {
  /* The publishable key is meant to be public; the table's row-level security policies decide access. */
  var SUPABASE_URL = 'https://phrmghhvxbcanukruwmp.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_kVdI_11j-5XVR15PWtGecg_eihAxGMV';
  var TABLE = 'meeting_actions';
  /* usernames sign in to Supabase Auth as <username>@LOGIN_DOMAIN; no mail is sent there */
  var LOGIN_DOMAIN = 'meeting-tracker.local';
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var iso = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var parse = function (s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  var todayDate = function () { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  var plusDays = function (n) { var t = todayDate(); return iso(new Date(t.getFullYear(), t.getMonth(), t.getDate() + n)); };
  var daysBetween = function (a, b) { return Math.round((a - b) / 86400000); };
  var uid = function () {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 3 | 8)).toString(16);
    });
  };
  var fmt = function (s) { return parse(s).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); };

  var state = { items: [] };
  var status = 'loading'; /* loading | ready | error */
  var filter = 'all';
  var undoInfo = null, toastTimer = null, refreshTimer = null;
  var pendingWrites = 0, writeSeq = 0;
  var user = null, people = [], channel = null;

  /* ---------- elements ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var els = {
    today: $('today'), open: $('n-open'), done: $('n-done'), late: $('n-late'), statLate: $('stat-late'),
    note: $('note'), groups: $('groups'), owners: $('owners'), form: $('add-form'),
    text: $('f-text'), owner: $('f-owner'), due: $('f-due'), toast: $('toast'), toastMsg: $('toast-msg'), undo: $('undo'),
    body: $('app-body'), who: $('who'), whoName: $('who-name'), login: $('login-form'),
    loginUser: $('l-user'), loginPass: $('l-pass'), loginBtn: $('l-btn'), loginErr: $('login-err'),
    pwForm: $('pw-form'), pwToggle: $('change-pw'), pwCurrent: $('pw-current'), pwNew: $('pw-new'), pwRepeat: $('pw-repeat'),
    pwBtn: $('pw-btn'), pwErr: $('pw-err'), addErr: $('add-err')
  };

  /* ---------- storage (Supabase) ---------- */
  var db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  function fromRow(r) {
    return { id: r.id, text: r.text, owner: r.owner, due: r.due, done: r.done, example: r.example, created: Date.parse(r.created_at) };
  }
  function toRow(it) {
    return { id: it.id, text: it.text, owner: it.owner, due: it.due, done: it.done, example: !!it.example, created_at: new Date(it.created).toISOString() };
  }

  function fetchAll() {
    if (!db) { status = 'error'; render(); return Promise.resolve(); }
    if (!user) return Promise.resolve();
    var seq = writeSeq;
    return db.from(TABLE).select('*').order('created_at').then(function (res) {
      if (res.error) throw res.error;
      /* a local change happened while this was in flight: the result is stale, so fetch again */
      if (pendingWrites || seq !== writeSeq) { scheduleRefresh(); return; }
      state.items = res.data.map(fromRow);
      status = 'ready';
    }).catch(function () {
      if (status === 'ready') flash('Couldn’t refresh the list');
      else status = 'error';
    }).then(render);
  }
  function scheduleRefresh() { clearTimeout(refreshTimer); refreshTimer = setTimeout(fetchAll, 150); }

  /* the screen updates first; if the write fails, reload the real list and say so */
  function write(query, failMsg) {
    pendingWrites++; writeSeq++;
    return query.then(function (res) {
      pendingWrites--;
      if (res.error) throw res.error;
    }, function (err) {
      pendingWrites--;
      throw err;
    }).catch(function () {
      flash(failMsg);
      fetchAll();
    });
  }

  function showToast(msg, canUndo) {
    els.toastMsg.textContent = msg;
    els.undo.hidden = !canUndo;
    els.toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { els.toast.hidden = true; undoInfo = null; }, 7000);
  }
  function flash(msg) { undoInfo = null; showToast(msg, false); }

  function h(tag, props) {
    var e = document.createElement(tag);
    var p = props || {};
    Object.keys(p).forEach(function (k) {
      var v = p[k];
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'checked') e.checked = !!v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid == null || kid === false) continue;
      e.append(kid);
    }
    return e;
  }

  function trashIcon() {
    var s = h('span', { 'aria-hidden': 'true' });
    s.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
    return s;
  }

  /* ---------- logic ---------- */
  function isLate(it, t) { return !it.done && it.due < t; }

  function dueLabel(it, t) {
    var diff = daysBetween(parse(it.due), parse(t));
    if (it.done) return 'Done · due ' + fmt(it.due);
    if (diff < 0) { var n = -diff; return n + (n === 1 ? ' day' : ' days') + ' overdue · ' + fmt(it.due); }
    if (diff === 0) return 'Due today';
    if (diff === 1) return 'Due tomorrow · ' + fmt(it.due);
    return 'Due ' + fmt(it.due) + (diff <= 14 ? ' · in ' + diff + ' days' : '');
  }

  function matches(it, t) {
    if (filter === 'open') return !it.done;
    if (filter === 'late') return isLate(it, t);
    if (filter === 'done') return it.done;
    return true;
  }

  function itemEl(it, t) {
    var late = isLate(it, t);
    var cb = h('input', { type: 'checkbox', checked: it.done });
    cb.addEventListener('change', function () { toggle(it.id, cb.checked); });
    return h('li', { class: 'item' + (late ? ' late' : '') + (it.done ? ' done' : ''), 'data-id': it.id },
      h('label', { class: 'row' },
        cb,
        h('span', { class: 'box', 'aria-hidden': 'true' }),
        h('span', { class: 'body' },
          h('span', { class: 'text', text: it.text }),
          h('span', { class: 'due', text: dueLabel(it, t) })
        )
      ),
      h('button', { class: 'x', type: 'button', 'aria-label': 'Delete action: ' + it.text, onclick: function () { remove(it.id); } }, trashIcon())
    );
  }

  function render() {
    var active = document.activeElement && document.activeElement.closest ? document.activeElement.closest('[data-id]') : null;
    var focusId = active ? active.getAttribute('data-id') : null;
    var t = iso(todayDate());
    var items = state.items;
    var open = items.filter(function (i) { return !i.done; }).length;
    var late = items.filter(function (i) { return isLate(i, t); }).length;

    els.today.textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    els.open.textContent = open;
    els.done.textContent = items.length - open;
    els.late.textContent = late;
    els.statLate.classList.toggle('on', late > 0);
    els.note.hidden = !items.some(function (i) { return i.example; });

    /* owner suggestions */
    var names = [];
    items.map(function (i) { return i.owner; }).concat(people).forEach(function (n) {
      var known = names.some(function (m) { return m.toLowerCase() === n.toLowerCase(); });
      if (!known) names.push(n);
    });
    els.owners.replaceChildren.apply(els.owners, names.sort().map(function (n) { return h('option', { value: n }); }));

    /* group by owner */
    var map = {};
    var order = [];
    items.forEach(function (it) {
      var k = it.owner.toLowerCase();
      if (!map[k]) { map[k] = { name: it.owner, all: [], vis: [] }; order.push(k); }
      map[k].all.push(it);
      if (matches(it, t)) map[k].vis.push(it);
    });
    var groups = order.map(function (k) {
      var g = map[k];
      g.late = g.all.filter(function (i) { return isLate(i, t); }).length;
      g.open = g.all.filter(function (i) { return !i.done; }).length;
      return g;
    }).sort(function (a, b) { return (b.late - a.late) || (b.open - a.open) || a.name.localeCompare(b.name); });

    var cmp = function (a, b) { return (Number(a.done) - Number(b.done)) || a.due.localeCompare(b.due) || (a.created - b.created); };
    var nodes = groups.filter(function (g) { return g.vis.length > 0; }).map(function (g) {
      var doneCount = g.all.length - g.open;
      var pill = g.late > 0
        ? h('span', { class: 'pill late', text: g.late + ' overdue' })
        : (g.open === 0 ? h('span', { class: 'pill ok', text: 'All done' }) : null);
      return h('section', { class: 'card group' },
        h('header', { class: 'g-head' },
          h('div', { class: 'avatar', 'aria-hidden': 'true', text: g.name.charAt(0).toUpperCase() }),
          h('div', { class: 'g-name' },
            h('h3', { text: g.name }),
            h('p', { text: g.open + ' open · ' + doneCount + ' done' })
          ),
          pill
        ),
        h.apply(null, ['ul', { class: 'items' }].concat(g.vis.slice().sort(cmp).map(function (it) { return itemEl(it, t); })))
      );
    });

    if (status === 'loading') {
      nodes = [h('div', { class: 'empty' }, h('strong', { text: 'Loading actions…' }), 'Fetching the team’s list.')];
    } else if (status === 'error') {
      nodes = [h('div', { class: 'empty' },
        h('strong', { text: 'Couldn’t load actions' }),
        'Check your connection, then ',
        h('button', { type: 'button', class: 'link', text: 'try again', onclick: function () { status = 'loading'; render(); fetchAll(); } })
      )];
    } else if (!nodes.length) {
      var msg = {
        all: ['No actions yet', 'Add the first one above, with an owner and a due date.'],
        open: ['No open actions', 'Everything agreed so far has been done.'],
        late: ['Nothing overdue', 'Every open action is still on time.'],
        done: ['Nothing ticked off yet', 'Completed actions will show up here.']
      }[filter];
      nodes = [h('div', { class: 'empty' }, h('strong', { text: msg[0] }), msg[1])];
    }
    els.groups.replaceChildren.apply(els.groups, nodes);
    if (focusId) refocus(focusId);
  }

  function refocus(id) {
    var el = document.querySelector('[data-id="' + id + '"] input');
    if (el) el.focus();
  }

  function toggle(id, done) {
    var it = state.items.find(function (i) { return i.id === id; });
    if (!it) return;
    it.done = done;
    render(); refocus(id);
    write(db.from(TABLE).update({ done: done }).eq('id', id), 'Couldn’t save that change');
  }

  function remove(id) {
    var idx = state.items.findIndex(function (i) { return i.id === id; });
    if (idx < 0) return;
    var removed = state.items.splice(idx, 1)[0];
    render();
    var pending = write(db.from(TABLE).delete().eq('id', id), 'Couldn’t delete that action');
    undoInfo = { item: removed, idx: idx, pending: pending };
    showToast('Action deleted', true);
  }

  els.undo.addEventListener('click', function () {
    if (!undoInfo) return;
    var info = undoInfo;
    state.items.splice(Math.min(info.idx, state.items.length), 0, info.item);
    undoInfo = null;
    els.toast.hidden = true;
    render();
    /* wait for the delete to finish so the re-insert doesn't clash with it */
    info.pending.then(function () {
      write(db.from(TABLE).insert(toRow(info.item)), 'Couldn’t restore that action');
    });
  });

  $('clear-examples').addEventListener('click', function () {
    state.items = state.items.filter(function (i) { return !i.example; });
    render();
    write(db.from(TABLE).delete().eq('example', true), 'Couldn’t clear the examples');
  });

  els.form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = els.text.value.trim();
    var ownerRaw = els.owner.value.trim().replace(/\s+/g, ' ');
    var due = els.due.value;
    var missing = !text ? els.text : !ownerRaw ? els.owner : !due ? els.due : null;
    if (missing) {
      els.addErr.textContent = 'Fill in the action, owner and due date.';
      els.addErr.hidden = false;
      missing.focus();
      return;
    }
    els.addErr.hidden = true;
    var existing = state.items.find(function (i) { return i.owner.toLowerCase() === ownerRaw.toLowerCase(); });
    var item = { id: uid(), text: text, owner: existing ? existing.owner : ownerRaw, due: due, done: false, example: false, created: Date.now() };
    state.items.push(item);
    write(db.from(TABLE).insert(toRow(item)), 'Couldn’t save that action');
    els.text.value = '';
    els.owner.value = '';
    els.due.value = plusDays(7);
    setFilter('all');
    els.text.focus();
  });

  function setFilter(f) {
    filter = f;
    document.querySelectorAll('.fbtn').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.filter === f));
    });
    render();
  }
  document.querySelectorAll('.fbtn').forEach(function (b) {
    b.addEventListener('click', function () { setFilter(b.dataset.filter); });
  });

  /* ---------- sign-in (Supabase Auth) ---------- */
  function toEmail(name) {
    var n = name.trim().toLowerCase();
    return n.indexOf('@') >= 0 ? n : n + '@' + LOGIN_DOMAIN;
  }

  function loginError(msg) {
    els.loginErr.textContent = msg;
    els.loginErr.hidden = false;
  }

  function showSignedIn(signedIn) {
    els.login.hidden = signedIn;
    els.body.hidden = !signedIn;
    els.who.hidden = !signedIn;
  }

  function fetchPeople() {
    return db.from('profiles').select('display_name').then(function (res) {
      if (res.error) return;
      people = res.data.map(function (p) { return p.display_name; });
      render();
    });
  }

  function start(u) {
    user = u;
    var meta = u.user_metadata || {};
    els.whoName.textContent = 'Signed in as ' + (meta.display_name || u.email.split('@')[0]);
    status = 'loading';
    showSignedIn(true);
    render();
    fetchAll();
    fetchPeople();
    /* pick up teammates' changes live */
    channel = db.channel('meeting-actions')
      .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, scheduleRefresh)
      .subscribe();
  }

  function stop() {
    user = null;
    if (channel) { db.removeChannel(channel); channel = null; }
    state.items = []; people = []; status = 'loading';
    undoInfo = null; els.toast.hidden = true;
    els.loginPass.value = '';
    showPasswordForm(false);
    showSignedIn(false);
    render();
    els.loginUser.focus();
  }

  els.login.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!db) return;
    els.loginErr.hidden = true;
    if (!els.loginUser.value.trim()) { loginError('Enter your username.'); els.loginUser.focus(); return; }
    if (!els.loginPass.value) { loginError('Enter your password.'); els.loginPass.focus(); return; }
    els.loginBtn.disabled = true;
    db.auth.signInWithPassword({ email: toEmail(els.loginUser.value), password: els.loginPass.value })
      .then(function (res) {
        if (res.error) {
          loginError(res.error.status === 400 ? 'Wrong username or password.' : 'Couldn’t sign in. Please try again.');
          els.loginPass.select();
        }
      })
      .catch(function () { loginError('Couldn’t reach the server. Check your connection and try again.'); })
      .then(function () { els.loginBtn.disabled = false; });
  });

  /* always end on the sign-in screen, even if the server can't be reached or there was no session */
  $('sign-out').addEventListener('click', function () {
    var finished = false;
    var finish = function () { if (!finished) { finished = true; stop(); } };
    db.auth.signOut({ scope: 'local' }).then(finish, finish);
    setTimeout(finish, 4000);
  });

  /* ---------- change password ---------- */
  function showPasswordForm(open) {
    els.pwForm.hidden = !open;
    els.pwToggle.setAttribute('aria-expanded', String(open));
    els.pwForm.reset();
    els.pwErr.hidden = true;
    pwBusy(false);
    if (open) els.pwCurrent.focus();
  }

  function pwBusy(busy) {
    els.pwBtn.disabled = busy;
    els.pwBtn.textContent = busy ? 'Saving…' : 'Save new password';
  }

  function pwError(msg, field) {
    els.pwErr.textContent = msg;
    els.pwErr.hidden = false;
    pwBusy(false);
    if (field) { field.focus(); field.select(); }
  }

  els.pwToggle.addEventListener('click', function () { showPasswordForm(els.pwForm.hidden); });
  $('pw-cancel').addEventListener('click', function () { showPasswordForm(false); els.pwToggle.focus(); });

  els.pwForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var current = els.pwCurrent.value, next = els.pwNew.value;
    els.pwErr.hidden = true;
    if (!current) return pwError('Enter your current password.', els.pwCurrent);
    if (next.length < 8) return pwError('Your new password needs at least 8 characters.', els.pwNew);
    if (next !== els.pwRepeat.value) return pwError('The new passwords don’t match.', els.pwRepeat);
    if (next === current) return pwError('Choose a password that’s different from your current one.', els.pwNew);
    if (!user) return pwError('You’re signed out. Sign in again to change your password.', null);
    pwBusy(true);
    /* check the current password first, so an unattended signed-in screen can't be used to take over the account */
    db.auth.signInWithPassword({ email: user.email, password: current })
      .then(function (res) {
        if (res.error) return pwError('Your current password isn’t right.', els.pwCurrent);
        return db.auth.updateUser({ password: next }).then(function (upd) {
          if (upd.error) {
            var code = upd.error.code;
            if (code === 'weak_password') return pwError('That password is too weak or has appeared in a data breach. Choose another.', els.pwNew);
            if (code === 'same_password') return pwError('Choose a password that’s different from your current one.', els.pwNew);
            return pwError('Couldn’t change your password: ' + upd.error.message, null);
          }
          showPasswordForm(false);
          flash('Password changed');
          els.pwToggle.focus();
        });
      })
      .catch(function () { pwError('Couldn’t reach the server. Check your connection and try again.', null); });
  });

  /* keep overdue state current */
  document.addEventListener('visibilitychange', function () { if (!document.hidden && user) fetchAll(); });

  els.due.value = plusDays(7);
  render();
  if (db) {
    db.auth.onAuthStateChange(function (event, session) {
      var u = session ? session.user : null;
      /* defer: calling Supabase from inside this callback can deadlock */
      setTimeout(function () {
        if (u && (!user || user.id !== u.id)) start(u);
        else if (!u) stop();
      }, 0);
    });
  } else {
    showSignedIn(false);
    loginError('Couldn’t load the sign-in service. Check your connection and reload the page.');
  }
})();
</script>
</body>
</html>
